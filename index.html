<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/day-tracking/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DayTrack" />
    <link rel="apple-touch-icon" href="/day-tracking/apple-touch-icon.png" />
    <meta name="description" content="Registro diario de calorías y seguimiento de peso" />
    <title>Day Tracking</title>
    <script>
      (function() {
        var theme = localStorage.getItem('daytracking-theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var color = theme === 'dark' ? '#111827' : '#f9fafb';
        document.querySelector('meta[name="theme-color"]').content = color;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
